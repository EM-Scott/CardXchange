<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚙️ 混合管理後台 - 寶可夢卡牌重組計劃</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes slideInDown { from { transform: translate3d(0, -100%, 0); opacity: 0; } to { transform: translate3d(0, 0, 0); opacity: 1; } }
        .toast-enter { animation: slideInDown 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div id="app" class="flex flex-col md:flex-row min-h-screen relative">
        
        <!-- 全域浮動通知 -->
        <div v-if="toast.show" class="fixed top-6 right-6 z-[100] toast-enter flex items-center p-4 mb-4 text-sm rounded-xl shadow-2xl min-w-[300px]" 
             :class="toast.type === 'error' ? 'bg-red-50 text-red-800 border-l-4 border-red-500' : 'bg-emerald-50 text-emerald-800 border-l-4 border-emerald-500'">
            <i :class="toast.type === 'error' ? 'fa-solid fa-triangle-exclamation text-2xl mr-3 text-red-500' : 'fa-solid fa-circle-check text-2xl mr-3 text-emerald-500'"></i>
            <div class="flex-1"><p class="font-bold text-base">{{ toast.title }}</p><p class="mt-0.5 opacity-90">{{ toast.message }}</p></div>
            <button @click="toast.show = false" class="ml-4 text-slate-400 hover:text-slate-700 text-lg"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- 登入畫面 -->
        <div v-if="!isLoggedIn" class="w-full flex items-center justify-center h-screen bg-slate-100 p-4">
            <div class="max-w-sm w-full bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
                <div class="text-center mb-6">
                    <i class="fa-solid fa-cloud-arrow-up text-4xl text-blue-600 mb-2"></i>
                    <h2 class="text-2xl font-bold text-slate-800">混合雲端後台</h2>
                </div>
                <div class="mb-4">
                    <input type="password" v-model="loginPassword" @keyup.enter="login" placeholder="請輸入 API 金鑰 (密碼)" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button @click="login" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 shadow-md transition">登入後台</button>
            </div>
        </div>

        <!-- 後台主畫面 -->
        <template v-else>
            <div class="md:hidden bg-slate-900 text-white p-4 flex justify-between items-center shadow-md z-20">
                <div class="font-bold text-lg flex items-center gap-2"><i class="fa-solid fa-bolt text-yellow-400"></i>管理端</div>
                <button @click="mobileMenuOpen = !mobileMenuOpen" class="text-2xl focus:outline-none"><i :class="mobileMenuOpen ? 'fa-solid fa-xmark' : 'fa-solid fa-bars'"></i></button>
            </div>
            
            <aside :class="mobileMenuOpen ? 'block' : 'hidden'" class="md:block w-full md:w-64 bg-slate-900 text-slate-300 flex-shrink-0 md:h-screen md:sticky md:top-0 shadow-xl z-10 flex flex-col transition-all">
                <div class="hidden md:flex p-6 items-center gap-3 border-b border-slate-800">
                    <i class="fa-solid fa-bolt text-yellow-400 text-2xl"></i><span class="font-bold text-xl text-white tracking-wide">看板後台</span>
                </div>
                <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                    <a @click="switchTab('orders')" :class="currentTab === 'orders' ? 'bg-blue-600 text-white shadow-md' : 'hover:bg-slate-800 hover:text-white'" class="flex items-center gap-3 px-4 py-3 rounded-lg cursor-pointer transition font-medium"><i class="fa-solid fa-file-invoice-dollar w-5 text-center"></i>訂單與雲端同步</a>
                    <a @click="switchTab('options')" :class="currentTab === 'options' ? 'bg-emerald-600 text-white shadow-md' : 'hover:bg-slate-800 hover:text-white'" class="flex items-center gap-3 px-4 py-3 rounded-lg cursor-pointer transition font-medium"><i class="fa-solid fa-list-check w-5 text-center"></i>靜態設定編輯器</a>
                </nav>
                <div class="p-4 border-t border-slate-800 space-y-3">
                    <a href="index.html" target="_blank" class="flex items-center justify-center gap-2 w-full px-4 py-2 bg-slate-800 text-slate-300 rounded-lg hover:bg-slate-700 hover:text-white transition text-sm"><i class="fa-solid fa-eye"></i> 預覽看板</a>
                    <button @click="logout" class="flex items-center justify-center gap-2 w-full px-4 py-2 border border-red-500/30 text-red-400 rounded-lg hover:bg-red-500/10 transition text-sm"><i class="fa-solid fa-right-from-bracket"></i> 登出</button>
                </div>
            </aside>

            <main class="flex-1 p-4 sm:p-8 md:p-10 overflow-y-auto max-w-6xl mx-auto w-full">
                
                <!-- 1. 訂單管理 -->
                <div v-show="currentTab === 'orders'" class="space-y-8 animate-fade-in">
                    
                    <div class="flex flex-wrap justify-between items-center mb-6 border-l-4 border-blue-600 pl-3">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-800">訂單編輯與同步</h2>
                            <p class="text-xs text-slate-500 mt-0.5">新增、修改或點擊狀態皆會「自動」背景同步至雲端。</p>
                        </div>
                        <div class="flex gap-3 mt-3 sm:mt-0">
                            <div v-if="apiError" class="bg-red-100 text-red-700 px-3 py-2 rounded-lg font-bold text-sm flex items-center"><i class="fa-solid fa-plug-circle-xmark mr-1.5"></i>雲端斷線 (使用本機)</div>
                            
                            <button @click="fetchOrdersFromCloud" :disabled="isSyncing" class="bg-blue-100 text-blue-700 px-4 py-2 rounded-lg font-bold text-sm hover:bg-blue-200 transition flex items-center">
                                <i class="fa-solid fa-cloud-arrow-down mr-1.5" :class="{'fa-spin': isSyncing}"></i>重新抓取
                            </button>
                            <!-- 手動同步按鈕保留作為防呆手段 -->
                            <button @click="() => saveOrdersToCloud(false)" :disabled="isSyncing" class="bg-blue-600 text-white px-5 py-2 rounded-lg font-bold text-sm hover:bg-blue-700 shadow-md transition flex items-center">
                                <i class="fa-solid fa-cloud-arrow-up mr-1.5" :class="{'fa-bounce': isSyncing}"></i>手動強制同步
                            </button>
                        </div>
                    </div>

                    <!-- 建立新訂單 -->
                    <div class="bg-white rounded-2xl shadow-sm border border-blue-100 overflow-visible">
                        <div class="bg-blue-50/50 px-6 py-4 border-b border-blue-100 flex flex-wrap justify-between items-center gap-4">
                            <h3 class="text-lg font-bold text-blue-800 flex items-center"><i class="fa-solid fa-cart-plus mr-2"></i>建立新訂單</h3>
                            <div class="flex flex-wrap gap-4 items-center">
                                <div><span class="text-xs text-blue-600 font-bold block mb-1">訂單編號</span><input type="text" v-model="currentOrder.id" class="px-3 py-1.5 text-sm border rounded outline-none"></div>
                                <div><span class="text-xs text-blue-600 font-bold block mb-1">日期</span><input type="date" v-model="currentOrder.date" required class="px-3 py-1.5 text-sm border rounded outline-none"></div>
                                <div>
                                    <span class="text-xs text-blue-600 font-bold block mb-1">平台</span>
                                    <select v-model="currentOrder.platform" class="px-3 py-1.5 text-sm border rounded w-32 outline-none"><option value="">未選擇</option><option v-for="p in appConfig.platforms" :key="p.id" :value="p.name">{{ p.name }}</option></select>
                                </div>
                                <div>
                                    <span class="text-xs text-blue-600 font-bold block mb-1">狀態</span>
                                    <select v-model="currentOrder.status" class="px-3 py-1.5 text-sm border rounded w-32 outline-none"><option v-for="s in appConfig.statuses" :key="s.id" :value="s.name">{{ s.name }}</option></select>
                                </div>
                            </div>
                        </div>

                        <div class="p-6">
                            <form @submit.prevent="addItemToOrder" class="flex flex-wrap gap-4 items-end bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6 relative">
                                <div class="flex-[2] min-w-[200px]">
                                    <label class="block text-sm font-medium text-slate-600 mb-1">加入商品 (可從下方預設商品快速點選)</label>
                                    <input type="text" v-model="currentItem.name" placeholder="商品名稱" required class="w-full p-2.5 border rounded outline-none bg-white" autocomplete="off">
                                </div>
                                <div class="flex-1 min-w-[100px]"><label class="block text-sm font-medium text-slate-600 mb-1">單價</label><input type="number" v-model.number="currentItem.unitPrice" required min="0" class="w-full p-2.5 border rounded outline-none"></div>
                                <div class="w-20"><label class="block text-sm font-medium text-slate-600 mb-1">數量</label><input type="number" v-model.number="currentItem.quantity" required min="1" class="w-full p-2.5 border rounded text-center"></div>
                                <div class="w-24 text-right"><label class="block text-xs font-medium text-slate-400 mb-2">小計</label><div class="p-1 font-bold text-slate-700">${{ currentItemSubtotal }}</div></div>
                                <button type="submit" class="bg-blue-100 text-blue-700 px-5 py-2.5 rounded font-bold hover:bg-blue-200">加入明細</button>
                            </form>

                            <div v-if="appConfig.products && appConfig.products.length > 0" class="mb-6 p-4 bg-slate-100 rounded-xl border border-slate-200">
                                <span class="text-xs font-bold text-slate-500 block mb-2"><i class="fa-solid fa-bolt mr-1 text-amber-500"></i>快速帶入預設商品：</span>
                                <div class="flex flex-wrap gap-2">
                                    <button type="button" v-for="prod in appConfig.products" :key="prod.id" @click="quickSelectProduct(prod)" class="bg-white hover:bg-blue-50 text-slate-700 hover:text-blue-600 border border-slate-200 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm transition flex items-center gap-2">
                                        <span>{{ prod.name }}</span>
                                        <span class="text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded">${{ prod.price }}</span>
                                    </button>
                                </div>
                            </div>

                            <div v-if="currentOrder.items.length > 0" class="mb-4 border rounded-xl overflow-hidden shadow-sm">
                                <table class="w-full text-left text-sm">
                                    <thead class="bg-slate-100 border-b"><tr><th class="p-3 pl-5">商品</th><th class="p-3 text-right">單價</th><th class="p-3 text-center">數量</th><th class="p-3 text-right">小計</th><th class="p-3 text-center">刪除</th></tr></thead>
                                    <tbody>
                                        <tr v-for="(item, index) in currentOrder.items" :key="index" class="border-b hover:bg-slate-50">
                                            <td class="p-3 pl-5 font-medium">{{ item.name }}</td><td class="p-3 text-right text-slate-500">${{ item.unitPrice }}</td><td class="p-3 text-center font-bold">x {{ item.quantity }}</td><td class="p-3 text-right text-blue-600 font-bold">${{ item.unitPrice * item.quantity }}</td>
                                            <td class="p-3 text-center"><button @click="removeItemFromOrder(index)" class="text-red-400 hover:text-red-600"><i class="fa-solid fa-times"></i></button></td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            
                            <div class="flex justify-between items-center mt-6 p-4 bg-slate-50 rounded-xl border border-slate-200">
                                <div class="text-slate-500">本筆訂單共 <span class="font-bold text-blue-600">{{ currentOrder.items.length }}</span> 項</div>
                                <div class="flex items-center gap-6">
                                    <div class="text-right"><span class="text-sm font-medium text-slate-500 mr-2">總金額:</span><span class="text-2xl font-bold text-red-500">NT$ {{ orderTotalAmount.toLocaleString() }}</span></div>
                                    <button @click="addOrderToList" class="bg-emerald-600 text-white px-8 py-3 rounded-lg font-bold hover:bg-emerald-700 shadow-md flex items-center transition">
                                        <i class="fa-solid fa-plus mr-2"></i>暫存並自動同步
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 歷史訂單列表 -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                        <h3 class="text-lg font-bold mb-4 border-b pb-2 flex items-center"><i class="fa-solid fa-list mr-2 text-slate-500"></i>當前訂單列表 (操作後會自動上傳)</h3>
                        
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-600 border-b">
                                        <th class="p-3 w-40">訂單編號/日期</th>
                                        <th class="p-3 min-w-[220px]">一鍵修改狀態</th>
                                        <th class="p-3">明細摘要</th>
                                        <th class="p-3 text-right w-28">總金額</th>
                                        <th class="p-3 text-center w-28">操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="order in sortedOrders" :key="order.id" class="border-b hover:bg-slate-50">
                                        <td class="p-3"><div class="font-bold text-slate-700">{{ order.id }}</div><div class="text-slate-500 text-xs mt-0.5">{{ formatDate(order.date) }}</div><div class="text-xs text-indigo-500 mt-1" v-if="order.platform"><i class="fa-solid fa-store mr-1"></i>{{ order.platform }}</div></td>
                                        
                                        <!-- ⭐️ 一鍵快速切換狀態 (根據名稱自動判斷顏色) -->
                                        <td class="p-3">
                                            <div class="flex flex-wrap gap-1.5">
                                                <button v-for="s in appConfig.statuses" :key="s.id" 
                                                    @click="updateOrderStatusDirect(order, s.name)"
                                                    :class="order.status === s.name ? getStatusBadgeClass(s.name) + ' shadow-sm border-transparent' : 'bg-white text-slate-500 border border-slate-200 hover:bg-slate-100'"
                                                    class="px-2 py-1 text-[11px] font-bold rounded transition-colors">
                                                    {{ s.name }}
                                                </button>
                                            </div>
                                        </td>

                                        <td class="p-3 text-slate-600"><div class="font-medium truncate max-w-[200px]">{{ order.items[0]?.name }}</div><div v-if="order.items.length > 1" class="text-xs bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded inline-block mt-1">等 {{ order.items.length }} 項明細</div></td>
                                        <td class="p-3 text-right text-emerald-600 font-bold text-base">NT$ {{ order.totalAmount.toLocaleString() }}</td>
                                        <td class="p-3 text-center">
                                            <div class="flex justify-center gap-2">
                                                <button @click="openEditModal(order)" class="text-blue-500 hover:text-blue-700 bg-blue-50 p-2 rounded" title="詳細編輯"><i class="fa-solid fa-pen-to-square"></i></button>
                                                <button @click="deleteOrder(order.id)" class="text-red-500 hover:text-red-700 bg-red-50 p-2 rounded" title="刪除"><i class="fa-solid fa-trash-can"></i></button>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr v-if="!appOrders || appOrders.length === 0">
                                        <td colspan="5" class="p-10 text-center text-slate-400">目前沒有訂單紀錄。</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 2. 靜態設定編輯器 -->
                <div v-show="currentTab === 'options'" class="space-y-6 animate-fade-in">
                    <div class="flex justify-between items-center mb-6 border-l-4 border-emerald-600 pl-3">
                        <h2 class="text-2xl font-bold text-slate-800">靜態設定編輯器 (產生 config.json)</h2>
                        <button @click="exportConfigJson" class="bg-emerald-600 text-white px-5 py-2 rounded-lg font-bold hover:bg-emerald-700 shadow-md">
                            <i class="fa-solid fa-file-export mr-2"></i>下載 config.json 檔案
                        </button>
                    </div>
                    
                    <div class="bg-white rounded-2xl shadow-sm p-6 border border-slate-200 mb-6">
                        <h3 class="text-lg font-bold mb-5 flex items-center"><i class="fa-solid fa-bullseye text-purple-600 mr-2"></i>系統與看板目標設定</h3>
                        
                        <div class="mb-5 pb-5 border-b border-slate-100">
                            <label class="block text-sm font-bold text-slate-700 mb-1">Google Apps Script 網頁應用程式網址</label>
                            <input type="text" v-model="appConfig.cloudApiUrl" @change="saveConfigLocalDraft" placeholder="https://script.google.com/macros/s/..." class="w-full p-2.5 border rounded-lg outline-none text-sm text-blue-700 bg-slate-50">
                        </div>

                        <div class="flex flex-col sm:flex-row gap-6">
                            <div class="flex-1 space-y-4">
                                <div><label class="block text-sm font-bold text-slate-700 mb-1">目標金額 (NT$)</label><input type="number" v-model.number="appConfig.targetAmount" @change="saveConfigLocalDraft" class="w-full p-2 border rounded-lg outline-none"></div>
                                <div><label class="block text-sm font-bold text-slate-700 mb-1">目標 PTCG 照片</label><input type="file" accept="image/*" @change="handleImageUpload" class="w-full text-sm"></div>
                            </div>
                            <div class="w-32 shrink-0 aspect-[5/7] bg-slate-100 border-2 border-dashed border-slate-300 rounded-xl flex items-center justify-center overflow-hidden">
                                <img v-if="appConfig.targetImage" :src="appConfig.targetImage" class="w-full h-full object-contain p-2" /><span v-else class="text-xs text-slate-400">無圖片</span>
                            </div>
                        </div>
                    </div>

                    <!-- ⭐️ 改為完全並列的三欄設計 -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        
                        <!-- 欄 1：預設商品 -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <div class="flex justify-between items-center mb-4">
                                <h3 class="font-bold text-slate-700 flex items-center"><i class="fa-solid fa-box-open mr-2 text-emerald-600"></i>預設商品</h3>
                                <label class="cursor-pointer bg-emerald-100 text-emerald-700 hover:bg-emerald-200 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center shadow-sm">
                                    <i class="fa-solid fa-file-excel mr-1.5"></i>Excel 匯入
                                    <input type="file" accept=".xlsx, .xls" class="hidden" @change="importProductsFromExcel">
                                </label>
                            </div>
                            <form @submit.prevent="addProduct" class="flex flex-col gap-3 mb-4 p-3 bg-slate-50 rounded-lg border border-slate-100">
                                <input type="text" v-model="newProduct.name" placeholder="商品名稱" required class="w-full p-2 text-sm border rounded">
                                <div class="flex gap-2"><input type="number" v-model.number="newProduct.price" placeholder="售價" required min="0" class="w-full p-2 text-sm border rounded"><button type="submit" class="bg-emerald-600 text-white px-4 rounded text-sm"><i class="fa-solid fa-plus"></i></button></div>
                            </form>
                            <div class="flex flex-col gap-2 max-h-80 overflow-y-auto pr-1">
                                <div v-for="prod in appConfig.products" :key="prod.id" class="border border-slate-200 rounded-lg px-3 py-2 text-sm flex justify-between items-center"><span class="font-medium text-slate-700 truncate mr-2">{{ prod.name }}</span><div class="flex items-center gap-3 shrink-0"><span class="text-slate-500 bg-slate-100 px-2 py-0.5 rounded font-mono">${{ prod.price }}</span><button @click="deleteProduct(prod.id)" class="text-red-400"><i class="fa-solid fa-times"></i></button></div></div>
                            </div>
                        </div>

                        <!-- 欄 2：平台管理 -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <h3 class="font-bold text-slate-700 mb-4 flex items-center"><i class="fa-solid fa-store mr-2 text-indigo-600"></i>平台管理</h3>
                            <form @submit.prevent="addPlatform" class="flex gap-2 mb-4 p-3 bg-slate-50 rounded-lg border"><input type="text" v-model="newPlatform" placeholder="平台名稱" required class="w-full p-2 text-sm border rounded"><button type="submit" class="bg-indigo-600 text-white px-4 rounded text-sm"><i class="fa-solid fa-plus"></i></button></form>
                            <div class="flex flex-col gap-2"><div v-for="plat in appConfig.platforms" :key="plat.id" class="border rounded-lg px-3 py-2 text-sm flex justify-between items-center"><span class="font-medium">{{ plat.name }}</span><button @click="deletePlatform(plat.id)" class="text-red-400"><i class="fa-solid fa-times"></i></button></div></div>
                        </div>

                        <!-- 欄 3：訂單狀態選項 (移至右側獨立一欄) -->
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                            <h3 class="font-bold text-slate-700 mb-4 flex items-center"><i class="fa-solid fa-tags mr-2 text-amber-600"></i>訂單狀態選項</h3>
                            <form @submit.prevent="addStatus" class="flex gap-2 mb-4 p-3 bg-slate-50 rounded-lg border"><input type="text" v-model="newStatus" placeholder="狀態名稱" required class="w-full p-2 text-sm border rounded"><button type="submit" class="bg-amber-500 text-white px-4 rounded text-sm"><i class="fa-solid fa-plus"></i></button></form>
                            <div class="flex flex-col gap-2"><div v-for="stat in appConfig.statuses" :key="stat.id" class="border rounded-lg px-3 py-2 text-sm flex justify-between items-center"><span class="font-medium">{{ stat.name }}</span><button @click="deleteStatus(stat.id)" class="text-red-400"><i class="fa-solid fa-times"></i></button></div></div>
                        </div>

                    </div>
                </div>
            </main>
        </template>

        <!-- 編輯訂單 Modal -->
        <div v-if="editModalOpen" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden">
                <div class="px-6 py-4 border-b flex justify-between items-center bg-slate-50"><h3 class="text-xl font-bold text-slate-800">編輯訂單內容</h3><button @click="editModalOpen = false" class="text-slate-400 hover:text-slate-600 text-2xl"><i class="fa-solid fa-xmark"></i></button></div>
                <div class="p-6 overflow-y-auto flex-1">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                        <div><label class="block text-xs font-bold text-slate-500 mb-1">訂單編號</label><input type="text" v-model="editingOrder.id" class="w-full p-2 border rounded"></div>
                        <div><label class="block text-xs font-bold text-slate-500 mb-1">日期</label><input type="date" v-model="editingOrder.date" required class="w-full p-2 border rounded"></div>
                        <div><label class="block text-xs font-bold text-slate-500 mb-1">平台</label><select v-model="editingOrder.platform" class="w-full p-2 border rounded"><option value="">無</option><option v-for="p in appConfig.platforms" :value="p.name">{{ p.name }}</option></select></div>
                        <div><label class="block text-xs font-bold text-slate-500 mb-1">狀態</label><select v-model="editingOrder.status" class="w-full p-2 border rounded"><option value="">無</option><option v-for="s in appConfig.statuses" :value="s.name">{{ s.name }}</option></select></div>
                    </div>
                    <div class="border rounded-xl overflow-hidden mb-4">
                        <table class="w-full text-left text-sm"><thead class="bg-slate-50 border-b text-slate-500"><tr><th class="p-2 pl-4">商品</th><th class="p-2 text-right">單價</th><th class="p-2 text-center w-20">數量</th><th class="p-2 text-right">小計</th><th class="p-2 text-center w-12">刪</th></tr></thead>
                            <tbody>
                                <tr v-for="(item, index) in editingOrder.items" :key="index" class="border-b"><td class="p-2 pl-4"><input type="text" v-model="item.name" class="w-full border rounded px-2 py-1"></td><td class="p-2"><input type="number" v-model.number="item.unitPrice" class="w-full border rounded px-2 py-1 text-right"></td><td class="p-2"><input type="number" v-model.number="item.quantity" class="w-full border rounded px-2 py-1 text-center"></td><td class="p-2 text-right font-bold">${{ item.unitPrice * item.quantity }}</td><td class="p-2 text-center"><button @click="editingOrder.items.splice(index,1)" class="text-red-500"><i class="fa-solid fa-trash-can"></i></button></td></tr>
                                <tr class="bg-blue-50/50"><td colspan="5" class="p-3 text-center"><button @click="editingOrder.items.push({name:'', unitPrice:0, quantity:1})" class="text-blue-600 text-sm"><i class="fa-solid fa-plus mr-1"></i>增加一列</button></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="px-6 py-4 border-t bg-slate-50 flex justify-between items-center"><div class="font-bold text-slate-600">重算總額: <span class="text-xl text-red-500 ml-2">NT$ {{ editingOrderTotal }}</span></div><div class="space-x-3"><button @click="editModalOpen = false" class="px-5 py-2 text-slate-600 rounded-lg">取消</button><button @click="saveEditOrder" class="px-5 py-2 bg-blue-600 text-white font-bold rounded-lg shadow-md">儲存並同步</button></div></div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, computed, onMounted } = Vue;
        const CONFIG_URL = "config.json";

        const fetchWithTimeout = async (url, timeout = 8000, options = {}) => {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, { signal: controller.signal, ...options });
                clearTimeout(timer);
                return response;
            } catch (err) {
                clearTimeout(timer);
                throw err;
            }
        };

        createApp({
            setup() {
                const isSyncing = ref(false);
                const apiError = ref(false);
                const isLoggedIn = ref(false);
                const loginPassword = ref('');
                const currentTab = ref('orders');
                const mobileMenuOpen = ref(false);
                
                const toast = reactive({ show: false, title: '', message: '', type: 'success' });
                let toastTimer = null;
                const showToast = (title, message, type = 'success') => {
                    toast.title = title; toast.message = message; toast.type = type; toast.show = true;
                    if(toastTimer) clearTimeout(toastTimer);
                    toastTimer = setTimeout(() => { toast.show = false; }, 5000);
                };

                const defaultConfig = {
                    targetAmount: 10000, targetImage: "", cloudApiUrl: "", products: [],
                    platforms: [{ id: 1, name: "蝦皮購物" }, { id: 2, name: "面交" }],
                    statuses: [{ id: 1, name: "新訂單" }, { id: 4, name: "已收款" }]
                };

                const appConfig = reactive(JSON.parse(JSON.stringify(defaultConfig)));
                const appOrders = ref([]);

                const newProduct = reactive({ name: '', price: null });
                const newPlatform = ref('');
                const newStatus = ref('');

                const formatDate = (dateStr) => {
                    if (!dateStr) return '';
                    try {
                        const d = new Date(dateStr);
                        if (isNaN(d.getTime())) return dateStr;
                        const year = d.getFullYear();
                        const month = String(d.getMonth() + 1).padStart(2, '0');
                        const day = String(d.getDate()).padStart(2, '0');
                        return `${year}-${month}-${day}`;
                    } catch (e) {
                        return dateStr;
                    }
                };

                const currentOrder = reactive({ id: '', date: '', platform: '', status: '', items: [] });
                const generateOrderId = () => { const d = new Date(); return `ORD-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${Math.floor(1000+Math.random()*9000)}`; };
                
                const resetCurrentOrder = () => {
                    currentOrder.id = generateOrderId();
                    currentOrder.date = new Date().toISOString().split('T')[0];
                    currentOrder.platform = appConfig.platforms.length > 0 ? appConfig.platforms[0].name : '';
                    currentOrder.status = appConfig.statuses.length > 0 ? appConfig.statuses[0].name : '';
                    currentOrder.items = [];
                };

                const currentItem = reactive({ name: '', unitPrice: null, quantity: 1 });

                const quickSelectProduct = (prod) => {
                    currentItem.name = prod.name;
                    currentItem.unitPrice = prod.price;
                    currentItem.quantity = 1;
                };

                const editModalOpen = ref(false);
                const editingOrder = reactive({ id: '', date: '', platform: '', status: '', items: [] });
                const editingOrderOriginalId = ref('');

                onMounted(async () => {
                    try {
                        const res = await fetchWithTimeout(CONFIG_URL, 3000);
                        if (res.ok) { Object.assign(appConfig, { ...defaultConfig, ...(await res.json()) }); }
                    } catch(e) {}
                    
                    const localDraft = localStorage.getItem('mezastarConfigDraft');
                    if (localDraft) { try { Object.assign(appConfig, JSON.parse(localDraft)); } catch(e){} }

                    resetCurrentOrder();

                    if (sessionStorage.getItem('adminLogged') === 'true') {
                        isLoggedIn.value = true;
                        loginPassword.value = sessionStorage.getItem('adminKey') || '';
                        
                        if (appConfig.cloudApiUrl) {
                            await fetchOrdersFromCloud();
                        } else {
                            loadLocalOrders();
                        }
                    }
                });

                const login = async () => { 
                    if(loginPassword.value) { 
                        isLoggedIn.value = true; 
                        sessionStorage.setItem('adminLogged', 'true'); 
                        sessionStorage.setItem('adminKey', loginPassword.value); 
                        
                        if (appConfig.cloudApiUrl) await fetchOrdersFromCloud();
                        else loadLocalOrders();
                    } 
                };
                
                const logout = () => { isLoggedIn.value = false; loginPassword.value = ''; sessionStorage.removeItem('adminLogged'); sessionStorage.removeItem('adminKey'); };
                const switchTab = (tab) => { currentTab.value = tab; mobileMenuOpen.value = false; };

                const saveConfigLocalDraft = () => { localStorage.setItem('mezastarConfigDraft', JSON.stringify(appConfig)); showToast("草稿已暫存", "設定檔變更已暫存於本機。", "success"); };
                const exportConfigJson = () => {
                    const dataStr = JSON.stringify(appConfig, null, 2);
                    const blob = new Blob([dataStr], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url; a.download = `config.json`; a.click(); URL.revokeObjectURL(url);
                    showToast("下載成功", "請記得將檔案上傳覆蓋舊檔。", "success");
                };

                const importProductsFromExcel = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        try {
                            const data = new Uint8Array(evt.target.result);
                            const workbook = XLSX.read(data, { type: 'array' });
                            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                            const json = XLSX.utils.sheet_to_json(worksheet);
                            
                            let count = 0;
                            json.forEach((row, index) => {
                                const name = row['商品名稱'] || row['name'] || row['名稱'] || row['Name'];
                                const price = row['售價'] || row['price'] || row['價格'] || row['Price'];
                                
                                if (name && price !== undefined) {
                                    appConfig.products.push({ 
                                        id: Date.now() + index,
                                        name: String(name).trim(), 
                                        price: Number(price) 
                                    });
                                    count++;
                                }
                            });
                            
                            if (count > 0) {
                                saveConfigLocalDraft();
                                showToast("匯入成功", `已成功從 Excel 匯入 ${count} 筆商品資料！`, "success");
                            } else {
                                showToast("匯入失敗", "找不到對應欄位，請確定 Excel 第一列有「商品名稱」與「售價」這兩個標題。", "error");
                            }
                        } catch (err) {
                            showToast("解析失敗", "讀取 Excel 檔案時發生錯誤，請確認檔案格式是否正確。", "error");
                        }
                        e.target.value = '';
                    };
                    reader.readAsArrayBuffer(file);
                };

                const saveOrdersToLocal = () => {
                    localStorage.setItem('mezastarOrdersCache', JSON.stringify(appOrders.value));
                };

                const loadLocalOrders = () => {
                    const cached = localStorage.getItem('mezastarOrdersCache');
                    if (cached) {
                        try { appOrders.value = JSON.parse(cached); } catch(e){}
                    }
                };

                const fetchOrdersFromCloud = async () => {
                    if (!appConfig.cloudApiUrl) { apiError.value = true; loadLocalOrders(); return; }
                    isSyncing.value = true;
                    apiError.value = false;
                    try {
                        const res = await fetchWithTimeout(appConfig.cloudApiUrl, 6000);
                        if (!res.ok) throw new Error("HTTP 狀態碼異常");
                        const data = await res.json();
                        
                        if (Array.isArray(data)) {
                            appOrders.value = data;
                            saveOrdersToLocal();
                            showToast("雲端同步", "已取得最新雲端訂單", "success");
                        } else if (data && Array.isArray(data.orders)) {
                            appOrders.value = data.orders;
                            saveOrdersToLocal();
                        } else {
                            throw new Error("格式錯誤");
                        }
                    } catch (err) {
                        apiError.value = true;
                        loadLocalOrders();
                        showToast("無法連線雲端", "已為您切換至本機暫存模式，請稍後再重試", "error");
                    } finally {
                        isSyncing.value = false;
                    }
                };

                // ⭐️ 核心修改：支援「背景自動同步」
                const saveOrdersToCloud = async (isAuto = false) => {
                    const auto = typeof isAuto === 'boolean' ? isAuto : false;
                    if (!appConfig.cloudApiUrl) { 
                        if (!auto) showToast("缺少 API 網址", "請先設定網址", "error"); 
                        return; 
                    }
                    isSyncing.value = true;
                    try {
                        const payload = { authKey: loginPassword.value, orders: appOrders.value };
                        const res = await fetchWithTimeout(appConfig.cloudApiUrl, 8000, { 
                            method: "POST", 
                            body: JSON.stringify(payload),
                            headers: { "Content-Type": "text/plain;charset=utf-8" } 
                        });
                        
                        if (!res.ok) throw new Error("HTTP 異常");
                        const result = await res.json();
                        
                        if (result.status === "error") {
                            showToast("同步遭拒", result.message, "error");
                        } else {
                            apiError.value = false;
                            if (auto) {
                                showToast("已自動同步", "資料已即時寫入雲端試算表", "success");
                            } else {
                                showToast("同步成功", "所有訂單已安全寫入 Google 試算表", "success");
                            }
                        }
                    } catch (err) {
                        apiError.value = true;
                        showToast("同步失敗", "無法連線，您的變更已安全暫存於本機", "error");
                    } finally {
                        isSyncing.value = false;
                    }
                };

                const handleImageUpload = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (evt) => { appConfig.targetImage = evt.target.result; saveConfigLocalDraft(); };
                        reader.readAsDataURL(file);
                    }
                };

                const addProduct = () => { appConfig.products.push({ id: Date.now(), name: newProduct.name, price: newProduct.price }); saveConfigLocalDraft(); newProduct.name = ''; newProduct.price = null; };
                const deleteProduct = (id) => { if(confirm('刪除？')) { appConfig.products = appConfig.products.filter(p => p.id !== id); saveConfigLocalDraft(); } };
                const addPlatform = () => { if (newPlatform.value.trim()) { appConfig.platforms.push({ id: Date.now(), name: newPlatform.value.trim() }); saveConfigLocalDraft(); newPlatform.value = ''; } };
                const deletePlatform = (id) => { if(confirm('刪除？')) { appConfig.platforms = appConfig.platforms.filter(p => p.id !== id); saveConfigLocalDraft(); } };
                const addStatus = () => { if (newStatus.value.trim()) { appConfig.statuses.push({ id: Date.now(), name: newStatus.value.trim() }); saveConfigLocalDraft(); newStatus.value = ''; } };
                const deleteStatus = (id) => { if(confirm('刪除？')) { appConfig.statuses = appConfig.statuses.filter(s => s.id !== id); saveConfigLocalDraft(); } };

                const currentItemSubtotal = computed(() => (currentItem.unitPrice && currentItem.quantity) ? (currentItem.unitPrice * currentItem.quantity) : 0);
                
                const addItemToOrder = () => {
                    if (!currentItem.name) return;
                    currentOrder.items.push({ name: currentItem.name, unitPrice: currentItem.unitPrice, quantity: currentItem.quantity });
                    currentItem.name = ''; currentItem.unitPrice = null; currentItem.quantity = 1;
                };

                const removeItemFromOrder = (i) => { currentOrder.items.splice(i, 1); };
                const orderTotalAmount = computed(() => currentOrder.items.reduce((sum, i) => sum + (i.unitPrice * i.quantity), 0));
                
                const addOrderToList = () => {
                    if (currentOrder.items.length === 0) { showToast("無法儲存", "請至少加入一項商品明細", "error"); return; }
                    appOrders.value.push({
                        id: currentOrder.id, date: currentOrder.date, platform: currentOrder.platform, status: currentOrder.status,
                        items: [...currentOrder.items], totalAmount: orderTotalAmount.value
                    });
                    
                    saveOrdersToLocal();
                    resetCurrentOrder();
                    // ⭐️ 觸發自動同步
                    saveOrdersToCloud(true);
                };

                const sortedOrders = computed(() => [...appOrders.value].sort((a, b) => new Date(b.date) - new Date(a.date)));

                const updateOrderStatusDirect = (order, newStatus) => {
                    if (order.status === newStatus) return;
                    order.status = newStatus;
                    saveOrdersToLocal();
                    // ⭐️ 觸發自動同步
                    saveOrdersToCloud(true);
                };

                const deleteOrder = (id) => {
                    if (confirm('確定刪除此訂單？')) {
                        appOrders.value = appOrders.value.filter(o => o.id !== id);
                        saveOrdersToLocal();
                        // ⭐️ 觸發自動同步
                        saveOrdersToCloud(true);
                    }
                };

                const openEditModal = (o) => { Object.assign(editingOrder, JSON.parse(JSON.stringify(o))); editingOrderOriginalId.value = o.id; editModalOpen.value = true; };
                const editingOrderTotal = computed(() => editingOrder.items.reduce((sum, i) => sum + ((i.unitPrice||0) * (i.quantity||0)), 0));
                
                const saveEditOrder = () => {
                    const idx = appOrders.value.findIndex(o => o.id === editingOrderOriginalId.value);
                    if (idx !== -1) {
                        editingOrder.totalAmount = editingOrderTotal.value;
                        appOrders.value[idx] = JSON.parse(JSON.stringify(editingOrder));
                        editModalOpen.value = false;
                        saveOrdersToLocal();
                        // ⭐️ 觸發自動同步
                        saveOrdersToCloud(true);
                    }
                };

                // ⭐️ 更新：採用與 index 相同的關鍵字顏色判斷邏輯
                const getStatusBadgeClass = (s) => {
                    if (!s) return 'bg-slate-100 text-slate-600 border-slate-200';
                    if (s.includes('新')) return 'bg-pink-100 text-pink-700 border-pink-200';
                    if (s.includes('打包') || s.includes('處理')) return 'bg-amber-100 text-amber-700 border-amber-200';
                    if (s.includes('出貨') || s.includes('寄出')) return 'bg-blue-100 text-blue-700 border-blue-200';
                    if (s.includes('收款') || s.includes('完成')) return 'bg-emerald-100 text-emerald-700 border-emerald-200';
                    return 'bg-purple-100 text-purple-700 border-purple-200';
                };

                return {
                    isSyncing, apiError, isLoggedIn, loginPassword, login, logout, currentTab, switchTab, mobileMenuOpen,
                    appConfig, appOrders, newProduct, newPlatform, newStatus, currentOrder, currentItem, saveConfigLocalDraft, handleImageUpload, exportConfigJson, 
                    importProductsFromExcel,
                    addProduct, deleteProduct, addPlatform, deletePlatform, addStatus, deleteStatus, 
                    currentItemSubtotal, addItemToOrder, addOrderToList, removeItemFromOrder, orderTotalAmount, sortedOrders, deleteOrder, 
                    fetchOrdersFromCloud, saveOrdersToCloud, editModalOpen, editingOrder, editingOrderTotal, openEditModal, 
                    saveEditOrder, getStatusBadgeClass, toast, resetCurrentOrder, formatDate, quickSelectProduct, 
                    updateOrderStatusDirect
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
