<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚙️ 混合管理後台 - 寶可夢卡牌重組計劃</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes slideInDown { from { transform: translate3d(0, -100%, 0); opacity: 0; } to { transform: translate3d(0, 0, 0); opacity: 1; } }
        .toast-enter { animation: slideInDown 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div id="app" class="flex flex-col md:flex-row min-h-screen relative">
        
        <!-- 全域浮動通知 -->
        <div v-if="toast.show" class="fixed top-4 right-4 left-4 sm:left-auto z-[100] toast-enter flex items-center p-4 mb-4 text-sm rounded-xl shadow-2xl sm:min-w-[300px] max-w-md" 
             :class="toast.type === 'error' ? 'bg-red-50 text-red-800 border-l-4 border-red-500' : 'bg-emerald-50 text-emerald-800 border-l-4 border-emerald-500'">
            <i :class="toast.type === 'error' ? 'fa-solid fa-triangle-exclamation text-2xl mr-3 text-red-500' : 'fa-solid fa-circle-check text-2xl mr-3 text-emerald-500'"></i>
            <div class="flex-1"><p class="font-bold text-base">{{ toast.title }}</p><p class="mt-0.5 opacity-90">{{ toast.message }}</p></div>
            <button @click="toast.show = false" class="ml-4 text-slate-400 hover:text-slate-700 text-lg"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- 登入畫面 -->
        <div v-if="!isLoggedIn" class="w-full flex items-center justify-center min-h-screen bg-slate-100 p-4">
            <div class="max-w-sm w-full bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
                <div class="text-center mb-6">
                    <i class="fa-solid fa-cloud-arrow-up text-4xl text-blue-600 mb-2"></i>
                    <h2 class="text-2xl font-bold text-slate-800">混合雲端後台</h2>
                </div>
                <div class="mb-4">
                    <input type="password" v-model="loginPassword" @keyup.enter="login" placeholder="請輸入 API 金鑰 (密碼)" class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button @click="login" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 shadow-md transition">登入後台</button>
            </div>
        </div>

        <!-- 後台主畫面 -->
        <template v-else>
            <div class="md:hidden bg-slate-900 text-white p-4 flex justify-between items-center shadow-md sticky top-0 z-30">
                <div class="font-bold text-lg flex items-center gap-2"><i class="fa-solid fa-bolt text-yellow-400"></i>管理端</div>
                <button @click="mobileMenuOpen = !mobileMenuOpen" class="text-2xl focus:outline-none p-1"><i :class="mobileMenuOpen ? 'fa-solid fa-xmark' : 'fa-solid fa-bars'"></i></button>
            </div>
            
            <aside :class="mobileMenuOpen ? 'block' : 'hidden'" class="md:block w-full md:w-64 bg-slate-900 text-slate-300 flex-shrink-0 md:h-screen md:sticky md:top-0 shadow-xl z-20 flex flex-col transition-all">
                <div class="hidden md:flex p-6 items-center gap-3 border-b border-slate-800">
                    <i class="fa-solid fa-bolt text-yellow-400 text-2xl"></i><span class="font-bold text-xl text-white tracking-wide">看板後台</span>
                </div>
                <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                    <a @click="switchTab('orderList')" :class="currentTab === 'orderList' ? 'bg-blue-600 text-white shadow-md' : 'hover:bg-slate-800 hover:text-white'" class="flex items-center justify-between px-4 py-3 rounded-lg cursor-pointer transition font-medium">
                        <span class="flex items-center gap-3"><i class="fa-solid fa-file-invoice-dollar w-5 text-center"></i>當前訂單列表</span>
                        <span class="text-xs px-2 py-0.5 rounded-full" :class="currentTab === 'orderList' ? 'bg-blue-500 text-white' : 'bg-slate-800 text-slate-400'">{{ appOrders.length }}</span>
                    </a>
                    <a @click="switchTab('newOrder')" :class="currentTab === 'newOrder' ? 'bg-indigo-600 text-white shadow-md' : 'hover:bg-slate-800 hover:text-white'" class="flex items-center justify-between px-4 py-3 rounded-lg cursor-pointer transition font-medium">
                        <span class="flex items-center gap-3"><i class="fa-solid fa-cart-plus w-5 text-center"></i>建立新訂單</span>
                        <span v-if="currentOrder.items.length > 0" class="text-xs px-2 py-0.5 rounded-full bg-amber-500 text-white font-bold">{{ currentOrder.items.length }}</span>
                    </a>
                    <a @click="switchTab('options')" :class="currentTab === 'options' ? 'bg-emerald-600 text-white shadow-md' : 'hover:bg-slate-800 hover:text-white'" class="flex items-center gap-3 px-4 py-3 rounded-lg cursor-pointer transition font-medium">
                        <i class="fa-solid fa-list-check w-5 text-center"></i>靜態設定編輯器
                    </a>
                </nav>
                <div class="p-4 border-t border-slate-800 space-y-3">
                    <a href="index.html" target="_blank" class="flex items-center justify-center gap-2 w-full px-4 py-2 bg-slate-800 text-slate-300 rounded-lg hover:bg-slate-700 hover:text-white transition text-sm"><i class="fa-solid fa-eye"></i> 預覽看板</a>
                    <button @click="logout" class="flex items-center justify-center gap-2 w-full px-4 py-2 border border-red-500/30 text-red-400 rounded-lg hover:bg-red-500/10 transition text-sm"><i class="fa-solid fa-right-from-bracket"></i> 登出</button>
                </div>
            </aside>

            <main class="flex-1 p-4 sm:p-6 md:p-10 overflow-x-hidden max-w-6xl mx-auto w-full">
                
                <!-- 1. 當前訂單列表 -->
                <div v-show="currentTab === 'orderList'" class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-l-4 border-blue-600 pl-3">
                        <div>
                            <h2 class="text-xl sm:text-2xl font-bold text-slate-800">當前訂單列表與雲端同步</h2>
                            <p class="text-xs text-slate-500 mt-0.5">點擊狀態、修改或刪除訂單皆會自動同步至雲端。</p>
                        </div>
                        <div class="flex flex-wrap gap-2 w-full sm:w-auto">
                            <div v-if="apiError" class="bg-red-100 text-red-700 px-3 py-2 rounded-lg font-bold text-xs sm:text-sm flex items-center"><i class="fa-solid fa-plug-circle-xmark mr-1.5"></i>雲端斷線</div>
                            
                            <button @click="switchTab('newOrder')" class="flex-1 sm:flex-none justify-center bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-indigo-700 shadow-sm transition flex items-center">
                                <i class="fa-solid fa-plus mr-1.5"></i>新增訂單
                            </button>
                            <button @click="fetchOrdersFromCloud" :disabled="isSyncing" class="flex-1 sm:flex-none justify-center bg-blue-100 text-blue-700 px-4 py-2 rounded-lg font-bold text-sm hover:bg-blue-200 transition flex items-center">
                                <i class="fa-solid fa-cloud-arrow-down mr-1.5" :class="{'fa-spin': isSyncing}"></i>重新抓取
                            </button>
                            <button @click="() => saveOrdersToCloud(false)" :disabled="isSyncing" class="flex-1 sm:flex-none justify-center bg-blue-600 text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-blue-700 shadow-md transition flex items-center">
                                <i class="fa-solid fa-cloud-arrow-up mr-1.5" :class="{'fa-bounce': isSyncing}"></i>手動同步
                            </button>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4 border-b pb-3">
                            <h3 class="text-lg font-bold flex items-center">
                                <i class="fa-solid fa-list mr-2 text-slate-500"></i>訂單紀錄
                                <span class="ml-2 text-xs font-normal text-slate-400">({{ filteredOrders.length }} / {{ appOrders.length }} 筆)</span>
                            </h3>
                            
                            <!-- 搜尋方塊 (含清除搜尋按鈕) -->
                            <div class="relative w-full sm:w-72">
                                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                                <input type="text" v-model="searchQuery" placeholder="搜尋訂單編號、系列、商品或平台..." class="w-full pl-9 pr-8 py-2 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none bg-slate-50 focus:bg-white transition">
                                <button v-if="searchQuery" type="button" @click="searchQuery = ''" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600" title="清除搜尋">
                                    <i class="fa-solid fa-circle-xmark"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm min-w-[760px]">
                                <thead>
                                    <tr class="bg-slate-50 text-slate-600 border-b">
                                        <th class="p-3 w-44">訂單編號/日期</th>
                                        <th class="p-3 w-52">一鍵修改狀態</th>
                                        <th class="p-3 min-w-[260px]">明細摘要</th>
                                        <th class="p-3 text-right w-28">總金額</th>
                                        <th class="p-3 text-center w-24">操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr v-for="(order, idx) in filteredOrders" :key="order.id || ('no-id-' + idx)" class="border-b hover:bg-slate-50 align-top">
                                        <td class="p-3">
                                            <div class="flex items-center gap-1.5">
                                                <span v-if="order.id" class="font-bold text-slate-700 break-all">{{ order.id }}</span>
                                                <span v-else class="text-xs text-slate-400 italic">無編號</span>
                                                <button v-if="order.id" type="button" @click="copyOrderId(order.id)" class="text-slate-400 hover:text-blue-600 hover:bg-blue-50 p-1 rounded transition shrink-0" title="複製訂單編號">
                                                    <i class="fa-regular fa-copy"></i>
                                                </button>
                                            </div>
                                            <div class="text-slate-500 text-xs mt-0.5">{{ formatDate(order.date) }}</div>
                                            <div class="text-xs text-indigo-500 mt-1" v-if="order.platform"><i class="fa-solid fa-store mr-1"></i>{{ order.platform }}</div>
                                        </td>
                                        
                                        <td class="p-3">
                                            <div class="flex flex-wrap gap-1.5">
                                                <button v-for="s in appConfig.statuses" :key="s.id" 
                                                    @click="updateOrderStatusDirect(order, s.name)"
                                                    :class="order.status === s.name ? getStatusBadgeClass(s.name) + ' shadow-sm border-transparent' : 'bg-white text-slate-500 border border-slate-200 hover:bg-slate-100'"
                                                    class="px-2 py-1 text-[11px] font-bold rounded transition-colors">
                                                    {{ s.name }}
                                                </button>
                                            </div>
                                        </td>

                                        <!-- 明細摘要 (完整顯示系列、名稱與數量，多項時可展開) -->
                                        <td class="p-3 text-slate-700">
                                            <template v-if="order.items && order.items.length > 0">
                                                <div v-if="order.items.length === 1 || !isOrderExpanded(order)">
                                                    <div class="font-medium leading-snug break-words flex flex-wrap items-center gap-1.5">
                                                        <span v-if="getItemSeries(order.items[0])" class="text-[11px] font-bold bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded whitespace-nowrap">{{ getItemSeries(order.items[0]) }}</span>
                                                        <span>{{ order.items[0].name }}</span>
                                                        <span class="text-xs font-bold text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded whitespace-nowrap">x {{ order.items[0].quantity }}</span>
                                                    </div>
                                                    <button v-if="order.items.length > 1" type="button" @click="toggleOrderExpand(order)"
                                                        class="mt-1.5 inline-flex items-center gap-1.5 text-xs font-bold bg-slate-100 hover:bg-blue-50 text-slate-600 hover:text-blue-600 border border-slate-200 hover:border-blue-200 px-2.5 py-1 rounded-md transition">
                                                        <i class="fa-solid fa-chevron-down text-[10px]"></i>
                                                        <span>展開其餘 {{ order.items.length - 1 }} 項明細 (共 {{ order.items.length }} 項)</span>
                                                    </button>
                                                </div>

                                                <div v-else class="space-y-1.5">
                                                    <div v-for="(item, iIdx) in order.items" :key="iIdx" class="flex items-start justify-between gap-2 text-xs bg-slate-50/80 border border-slate-200/80 rounded-lg px-2.5 py-1.5">
                                                        <div class="font-medium text-slate-700 leading-snug break-words flex-1 flex flex-wrap items-center gap-1.5">
                                                            <span class="text-slate-400 font-mono">{{ iIdx + 1 }}.</span>
                                                            <span v-if="getItemSeries(item)" class="text-[10px] font-bold bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded whitespace-nowrap">{{ getItemSeries(item) }}</span>
                                                            <span>{{ item.name }}</span>
                                                        </div>
                                                        <div class="flex items-center gap-1.5 shrink-0 whitespace-nowrap">
                                                            <span class="text-slate-400 font-mono">${{ item.unitPrice }}</span>
                                                            <span class="font-bold text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded">x {{ item.quantity }}</span>
                                                        </div>
                                                    </div>
                                                    <button type="button" @click="toggleOrderExpand(order)"
                                                        class="inline-flex items-center gap-1.5 text-xs font-bold bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 px-2.5 py-1 rounded-md transition">
                                                        <i class="fa-solid fa-chevron-up text-[10px]"></i>
                                                        <span>收合明細</span>
                                                    </button>
                                                </div>
                                            </template>
                                            <span v-else class="text-xs text-slate-400 italic">無商品明細</span>
                                        </td>

                                        <td class="p-3 text-right text-emerald-600 font-bold text-base whitespace-nowrap">NT$ {{ order.totalAmount.toLocaleString() }}</td>
                                        <td class="p-3 text-center">
                                            <div class="flex justify-center gap-2">
                                                <button @click="openEditModal(order)" class="text-blue-500 hover:text-blue-700 bg-blue-50 p-2 rounded" title="詳細編輯"><i class="fa-solid fa-pen-to-square"></i></button>
                                                <button @click="deleteOrder(order)" class="text-red-500 hover:text-red-700 bg-red-50 p-2 rounded" title="刪除"><i class="fa-solid fa-trash-can"></i></button>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr v-if="!filteredOrders || filteredOrders.length === 0">
                                        <td colspan="5" class="p-10 text-center text-slate-400">
                                            <span v-if="searchQuery">找不到符合「{{ searchQuery }}」的訂單。</span>
                                            <span v-else>目前沒有訂單紀錄。</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- 2. 建立新訂單 -->
                <div v-show="currentTab === 'newOrder'" class="space-y-6">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-l-4 border-indigo-600 pl-3">
                        <div>
                            <h2 class="text-xl sm:text-2xl font-bold text-slate-800">建立新訂單</h2>
                            <p class="text-xs text-slate-500 mt-0.5">選擇預設商品或自訂品項，建立完成後會自動寫入雲端。</p>
                        </div>
                        <button @click="switchTab('orderList')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg font-bold text-sm transition flex items-center gap-1.5">
                            <i class="fa-solid fa-arrow-left"></i>返回訂單列表
                        </button>
                    </div>

                    <div class="bg-white rounded-2xl shadow-sm border border-indigo-100 overflow-hidden">
                        <div class="bg-indigo-50/60 px-4 sm:px-6 py-4 border-b border-indigo-100 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                            <h3 class="text-lg font-bold text-indigo-800 flex items-center shrink-0"><i class="fa-solid fa-receipt mr-2"></i>訂單基本資料</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 w-full lg:w-auto">
                                <div>
                                    <span class="text-xs text-indigo-600 font-bold block mb-1">訂單編號 (可空白)</span>
                                    <input type="text" v-model="currentOrder.id" placeholder="選填，可留白" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg outline-none focus:border-indigo-500 bg-white">
                                </div>
                                <div>
                                    <span class="text-xs text-indigo-600 font-bold block mb-1">日期</span>
                                    <input type="date" v-model="currentOrder.date" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg outline-none focus:border-indigo-500 bg-white">
                                </div>
                                <div>
                                    <span class="text-xs text-indigo-600 font-bold block mb-1">平台</span>
                                    <select v-model="currentOrder.platform" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg outline-none focus:border-indigo-500 bg-white">
                                        <option value="">未選擇</option>
                                        <option v-for="p in appConfig.platforms" :key="p.id" :value="p.name">{{ p.name }}</option>
                                    </select>
                                </div>
                                <div>
                                    <span class="text-xs text-indigo-600 font-bold block mb-1">狀態</span>
                                    <select v-model="currentOrder.status" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg outline-none focus:border-indigo-500 bg-white">
                                        <option v-for="s in appConfig.statuses" :key="s.id" :value="s.name">{{ s.name }}</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="p-4 sm:p-6 space-y-5">
                            <!-- 多選預設商品區塊 -->
                            <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
                                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                                    <span class="text-xs font-bold text-slate-600 flex items-center">
                                        <i class="fa-solid fa-list-check mr-1.5 text-amber-500"></i>快速多選預設商品 (可點選多項後一次加入)：
                                    </span>
                                    <button v-if="appConfig.products && appConfig.products.length > 0" type="button" @click="addSelectedProductsToOrder" :disabled="selectedProductIds.length === 0"
                                        :class="selectedProductIds.length > 0 ? 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm' : 'bg-slate-200 text-slate-400 cursor-not-allowed'"
                                        class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 shrink-0">
                                        <i class="fa-solid fa-plus"></i>加入已選商品 ({{ selectedProductIds.length }})
                                    </button>
                                </div>

                                <!-- 系列快速篩選（若有設定系列時顯示） -->
                                <div v-if="productSeriesList.length > 0" class="flex flex-wrap items-center gap-1.5 mb-3 pb-2.5 border-b border-slate-200/80">
                                    <span class="text-[11px] font-bold text-slate-400 mr-1">系列篩選：</span>
                                    <button type="button" @click="selectedProductSeriesFilter = 'ALL'"
                                        :class="selectedProductSeriesFilter === 'ALL' ? 'bg-slate-700 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'"
                                        class="px-2.5 py-1 rounded-md text-[11px] font-bold transition">
                                        全部 ({{ appConfig.products.length }})
                                    </button>
                                    <button type="button" v-for="sr in productSeriesList" :key="sr" @click="selectedProductSeriesFilter = sr"
                                        :class="selectedProductSeriesFilter === sr ? 'bg-purple-600 text-white' : 'bg-white text-purple-700 border border-purple-200 hover:bg-purple-50'"
                                        class="px-2.5 py-1 rounded-md text-[11px] font-bold transition">
                                        {{ sr }}
                                    </button>
                                </div>

                                <div v-if="filteredPresetProducts.length > 0" class="flex flex-wrap gap-2">
                                    <button type="button" v-for="prod in filteredPresetProducts" :key="prod.id" @click="toggleProductSelection(prod.id)"
                                        :class="selectedProductIds.includes(prod.id) ? 'bg-indigo-50 border-indigo-500 text-indigo-700 ring-1 ring-indigo-500' : 'bg-white border-slate-200 text-slate-700 hover:bg-slate-100'"
                                        class="border px-3 py-2 rounded-lg text-xs font-bold shadow-sm transition flex items-center gap-2 select-none">
                                        <i :class="selectedProductIds.includes(prod.id) ? 'fa-solid fa-square-check text-indigo-600' : 'fa-regular fa-square text-slate-400'"></i>
                                        <span v-if="prod.series" class="text-[10px] font-bold bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded">{{ prod.series }}</span>
                                        <span>{{ prod.name }}</span>
                                        <span class="text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded">${{ prod.price }}</span>
                                    </button>
                                </div>
                                <div v-else class="text-xs text-slate-400 flex flex-wrap items-center gap-2">
                                    <span>目前尚未設定預設商品。</span>
                                    <button type="button" @click="reloadConfigFromServer" class="text-blue-600 hover:underline font-bold">重新讀取 config.json</button>
                                    <span>或前往「靜態設定編輯器」新增。</span>
                                </div>
                            </div>

                            <!-- 手動單筆輸入表單 -->
                            <form @submit.prevent="addItemToOrder" class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-end bg-slate-50/70 p-4 rounded-xl border border-slate-200">
                                <div class="sm:col-span-3">
                                    <label class="block text-xs font-bold text-slate-600 mb-1">系列 (選填)</label>

    <script>
        const { createApp, ref, reactive, computed, onMounted } = Vue;
        const CONFIG_URL = "config.json";

        const fetchWithTimeout = async (url, timeout = 8000, options = {}) => {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, { signal: controller.signal, ...options });
                clearTimeout(timer);
                return response;
            } catch (err) {
                clearTimeout(timer);
                throw err;
            }
        };

        createApp({
            setup() {
                const isSyncing = ref(false);
                const apiError = ref(false);
                const isLoggedIn = ref(false);
                const loginPassword = ref('');
                const currentTab = ref('orderList');
                const mobileMenuOpen = ref(false);
                const searchQuery = ref('');
                const bundleTotalPrice = ref(null);
                const expandedOrders = ref([]);
                const selectedProductSeriesFilter = ref('ALL');
                
                const toast = reactive({ show: false, title: '', message: '', type: 'success' });
                let toastTimer = null;
                const showToast = (title, message, type = 'success') => {
                    toast.title = title; toast.message = message; toast.type = type; toast.show = true;
                    if(toastTimer) clearTimeout(toastTimer);
                    toastTimer = setTimeout(() => { toast.show = false; }, 5000);
                };

                const defaultConfig = {
                    targetAmount: 10000, targetImage: "", cloudApiUrl: "", products: [],
                    platforms: [{ id: 1, name: "蝦皮購物" }, { id: 2, name: "面交" }],
                    statuses: [{ id: 1, name: "新訂單" }, { id: 4, name: "已收款" }]
                };

                const appConfig = reactive(JSON.parse(JSON.stringify(defaultConfig)));
                const appOrders = ref([]);

                const newProduct = reactive({ series: '', name: '', price: null });
                const editingProductId = ref(null);
                const editingProductForm = reactive({ id: null, series: '', name: '', price: 0 });
                const newPlatform = ref('');
                const newStatus = ref('');

                const normalizeConfigLists = () => {
                    if (Array.isArray(appConfig.products)) {
                        appConfig.products = appConfig.products.map((p, idx) => ({
                            id: p.id ?? (Date.now() + idx),
                            series: (p.series ?? '').trim(),
                            name: p.name ?? '',
                            price: Number(p.price ?? 0)
                        }));
                    } else {
                        appConfig.products = [];
                    }
                    if (Array.isArray(appConfig.platforms)) {
                        appConfig.platforms = appConfig.platforms.map((p, idx) => ({
                            id: p.id ?? (Date.now() + idx + 1000),
                            name: p.name ?? ''
                        }));
                    }
                    if (Array.isArray(appConfig.statuses)) {
                        appConfig.statuses = appConfig.statuses.map((s, idx) => ({
                            id: s.id ?? (Date.now() + idx + 2000),
                            name: s.name ?? ''
                        }));
                    }
                };

                const getItemSeries = (item) => {
                    if (!item) return '';
                    if (item.series && String(item.series).trim()) return String(item.series).trim();
                    if (Array.isArray(appConfig.products) && item.name) {
                        const matched = appConfig.products.find(p => p.name === item.name && p.series);
                        if (matched) return String(matched.series).trim();
                    }
                    return '';
                };

                const productSeriesList = computed(() => {
                    const set = new Set();
                    if (Array.isArray(appConfig.products)) {
                        appConfig.products.forEach(p => {
                            if (p.series && p.series.trim()) {
                                set.add(p.series.trim());
                            }
                        });
                    }
                    return Array.from(set);
                });

                const filteredPresetProducts = computed(() => {
                    if (!Array.isArray(appConfig.products)) return [];
                    if (selectedProductSeriesFilter.value === 'ALL') return appConfig.products;
                    return appConfig.products.filter(p => (p.series || '').trim() === selectedProductSeriesFilter.value);
                });

                const formatDate = (dateStr) => {
                    if (!dateStr) return '';
                    try {
                        const d = new Date(dateStr);
                        if (isNaN(d.getTime())) return dateStr;
                        const year = d.getFullYear();
                        const month = String(d.getMonth() + 1).padStart(2, '0');
                        const day = String(d.getDate()).padStart(2, '0');
                        return `${year}-${month}-${day}`;
                    } catch (e) {
                        return dateStr;
                    }
                };

                const currentOrder = reactive({ id: '', date: '', platform: '', status: '', items: [] });
                
                const resetCurrentOrder = () => {
                    currentOrder.id = '';
                    currentOrder.date = new Date().toISOString().split('T')[0];
                    currentOrder.platform = appConfig.platforms.length > 0 ? appConfig.platforms[0].name : '';
                    currentOrder.status = appConfig.statuses.length > 0 ? appConfig.statuses[0].name : '';
                    currentOrder.items = [];
                    selectedProductIds.value = [];
                    bundleTotalPrice.value = null;
                };

                const currentItem = reactive({ series: '', name: '', unitPrice: null, quantity: 1 });
                const selectedProductIds = ref([]);

                const toggleProductSelection = (prodId) => {
                    const idx = selectedProductIds.value.indexOf(prodId);
                    if (idx === -1) {
                        selectedProductIds.value.push(prodId);
                    } else {
                        selectedProductIds.value.splice(idx, 1);
                    }
                };

                const addSelectedProductsToOrder = () => {
                    if (selectedProductIds.value.length === 0) return;
                    selectedProductIds.value.forEach(id => {
                        const prod = appConfig.products.find(p => p.id === id);
                        if (prod) {
                            const prodSeries = (prod.series || '').trim();
                            const existing = currentOrder.items.find(i => i.name === prod.name && (i.series || '') === prodSeries && i.unitPrice === prod.price);
                            if (existing) {
                                existing.quantity += 1;
                            } else {
                                currentOrder.items.push({ series: prodSeries, name: prod.name, unitPrice: prod.price, quantity: 1 });
                            }
                        }
                    });
                    selectedProductIds.value = [];
                };

                const distributeBundlePrice = () => {
                    const total = Number(bundleTotalPrice.value);
                    if (bundleTotalPrice.value === '' || bundleTotalPrice.value === null || isNaN(total) || total < 0) {
                        showToast("請輸入有效金額", "請輸入大於或等於 0 的總價。", "error");
                        return;
                    }
                    if (currentOrder.items.length === 0) {
                        showToast("尚無商品明細", "請先選擇或加入商品後再進行總價均分。", "error");
                        return;
                    }
                    const totalQty = currentOrder.items.reduce((sum, item) => sum + (Number(item.quantity) || 1), 0);
                    if (totalQty <= 0) return;

                    const allSingleQty = currentOrder.items.every(item => (Number(item.quantity) || 1) === 1);
                    if (total % totalQty === 0) {
                        const avg = total / totalQty;
                        currentOrder.items.forEach(item => { item.unitPrice = avg; });
                    } else if (allSingleQty) {
                        const base = Math.floor(total / totalQty);
                        const remainder = total % totalQty;
                        currentOrder.items.forEach((item, idx) => {
                            item.unitPrice = base + (idx < remainder ? 1 : 0);
                        });
                    } else {
                        const avg = Math.round(total / totalQty);
                        currentOrder.items.forEach(item => { item.unitPrice = avg; });
                    }
                    showToast("已自動均分", `已將總價 NT$ ${total.toLocaleString()} 平均分配至 ${totalQty} 件商品`, "success");
                };

                const copyOrderId = async (id) => {
                    if (!id) return;
                    try {
                        await navigator.clipboard.writeText(id);
                        showToast("已複製", `訂單編號「${id}」已複製到剪貼簿`, "success");
                    } catch (err) {
                        const textarea = document.createElement('textarea');
                        textarea.value = id;
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                        showToast("已複製", `訂單編號「${id}」已複製到剪貼簿`, "success");
                    }
                };

                const toggleOrderExpand = (order) => {
                    const idx = expandedOrders.value.indexOf(order);
                    if (idx === -1) {
                        expandedOrders.value.push(order);
                    } else {
                        expandedOrders.value.splice(idx, 1);
                    }
                };

                const isOrderExpanded = (order) => expandedOrders.value.includes(order);

                const editModalOpen = ref(false);
                const editingOrder = reactive({ id: '', date: '', platform: '', status: '', items: [] });
                const editingOrderIndex = ref(-1);

                const loadConfigData = async (ignoreDraft = false) => {
                    let remoteConfig = null;
                    try {
                        const res = await fetchWithTimeout(`${CONFIG_URL}?t=${Date.now()}`, 3000);
                        if (res.ok) {
                            remoteConfig = await res.json();
                            Object.assign(appConfig, { ...defaultConfig, ...remoteConfig });
                        }
                    } catch(e) {}

                    if (!ignoreDraft) {
                        const localDraft = localStorage.getItem('mezastarConfigDraft');
                        if (localDraft) {
                            try {
                                const parsedDraft = JSON.parse(localDraft);
                                if (remoteConfig && Array.isArray(remoteConfig.products) && remoteConfig.products.length > 0 && (!parsedDraft.products || parsedDraft.products.length === 0)) {
                                    parsedDraft.products = remoteConfig.products;
                                }
                                Object.assign(appConfig, parsedDraft);
                            } catch(e) {}
                        }
                    }
                    normalizeConfigLists();
                };

                const reloadConfigFromServer = async () => {
                    localStorage.removeItem('mezastarConfigDraft');
                    editingProductId.value = null;
                    await loadConfigData(true);
                    resetCurrentOrder();
                    showToast("已重新載入", `已同步最新 config.json（共 ${appConfig.products.length} 項預設商品）`, "success");
                };

                onMounted(async () => {
                    await loadConfigData(false);
                    resetCurrentOrder();

                    if (sessionStorage.getItem('adminLogged') === 'true') {
                        isLoggedIn.value = true;
                        loginPassword.value = sessionStorage.getItem('adminKey') || '';
                        
                        if (appConfig.cloudApiUrl) {
                            await fetchOrdersFromCloud();
                        } else {
                            loadLocalOrders();
                        }
                    }
                });

                const login = async () => { 
                    if(loginPassword.value) { 
                        isLoggedIn.value = true; 
                        sessionStorage.setItem('adminLogged', 'true'); 
                        sessionStorage.setItem('adminKey', loginPassword.value); 
                        
                        if (appConfig.cloudApiUrl) await fetchOrdersFromCloud();
                        else loadLocalOrders();
                    } 
                };
                
                const logout = () => { isLoggedIn.value = false; loginPassword.value = ''; sessionStorage.removeItem('adminLogged'); sessionStorage.removeItem('adminKey'); };
                const switchTab = (tab) => { currentTab.value = tab; mobileMenuOpen.value = false; };

                const saveConfigLocalDraft = () => { localStorage.setItem('mezastarConfigDraft', JSON.stringify(appConfig)); showToast("草稿已暫存", "設定檔變更已暫存於本機。", "success"); };
                const exportConfigJson = () => {
                    const dataStr = JSON.stringify(appConfig, null, 2);
                    const blob = new Blob([dataStr], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url; a.download = `config.json`; a.click(); URL.revokeObjectURL(url);
                    showToast("下載成功", "請記得將檔案上傳覆蓋舊檔。", "success");
                };

                const importProductsFromExcel = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        try {
                            const data = new Uint8Array(evt.target.result);
                            const workbook = XLSX.read(data, { type: 'array' });
                            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                            const json = XLSX.utils.sheet_to_json(worksheet);
                            
                            let count = 0;
                            json.forEach((row, index) => {
                                const series = row['系列'] || row['series'] || row['Series'] || '';
                                const name = row['商品名稱'] || row['name'] || row['名稱'] || row['Name'];
                                const price = row['售價'] || row['price'] || row['價格'] || row['Price'];
                                
                                if (name && price !== undefined) {
                                    appConfig.products.push({ 
                                        id: Date.now() + index,
                                        series: String(series).trim(),
                                        name: String(name).trim(), 
                                        price: Number(price) 
                                    });
                                    count++;
                                }
                            });
                            
                            if (count > 0) {
                                saveConfigLocalDraft();
                                showToast("匯入成功", `已成功從 Excel 匯入 ${count} 筆商品資料！`, "success");
                            } else {
                                showToast("匯入失敗", "找不到對應欄位，請確定 Excel 第一列有「商品名稱」與「售價」（可選填「系列」）。", "error");
                            }
                        } catch (err) {
                            showToast("解析失敗", "讀取 Excel 檔案時發生錯誤，請確認檔案格式是否正確。", "error");
                        }
                        e.target.value = '';
                    };
                    reader.readAsArrayBuffer(file);
                };

                const saveOrdersToLocal = () => {
                    localStorage.setItem('mezastarOrdersCache', JSON.stringify(appOrders.value));
                };

                const loadLocalOrders = () => {
                    const cached = localStorage.getItem('mezastarOrdersCache');
                    if (cached) {
                        try { appOrders.value = JSON.parse(cached); } catch(e){}
                    }
                };

                const fetchOrdersFromCloud = async () => {
                    if (!appConfig.cloudApiUrl) { apiError.value = true; loadLocalOrders(); return; }
                    isSyncing.value = true;
                    apiError.value = false;
                    try {
                        const res = await fetchWithTimeout(appConfig.cloudApiUrl, 6000);
                        if (!res.ok) throw new Error("HTTP 狀態碼異常");
                        const data = await res.json();
                        
                        if (Array.isArray(data)) {
                            appOrders.value = data;
                            expandedOrders.value = [];
                            saveOrdersToLocal();
                            showToast("雲端同步", "已取得最新雲端訂單", "success");
                        } else if (data && Array.isArray(data.orders)) {
                            appOrders.value = data.orders;
                            expandedOrders.value = [];
                            saveOrdersToLocal();
                        } else {
                            throw new Error("格式錯誤");
                        }
                    } catch (err) {
                        apiError.value = true;
                        loadLocalOrders();
                        showToast("無法連線雲端", "已為您切換至本機暫存模式，請稍後再重試", "error");
                    } finally {
                        isSyncing.value = false;
                    }
                };

                const saveOrdersToCloud = async (isAuto = false) => {
                    const auto = typeof isAuto === 'boolean' ? isAuto : false;
                    if (!appConfig.cloudApiUrl) { 
                        if (!auto) showToast("缺少 API 網址", "請先設定網址", "error"); 
                        return; 
                    }
                    isSyncing.value = true;
                    try {
                        const payload = { authKey: loginPassword.value, orders: appOrders.value };
                        const res = await fetchWithTimeout(appConfig.cloudApiUrl, 8000, { 
                            method: "POST", 
                            body: JSON.stringify(payload),
                            headers: { "Content-Type": "text/plain;charset=utf-8" } 
                        });
                        
                        if (!res.ok) throw new Error("HTTP 異常");
                        const result = await res.json();
                        
                        if (result.status === "error") {
                            showToast("同步遭拒", result.message, "error");
                        } else {
                            apiError.value = false;
                            if (auto) {
                                showToast("已自動同步", "資料已即時寫入雲端試算表", "success");
                            } else {
                                showToast("同步成功", "所有訂單已安全寫入 Google 試算表", "success");
                            }
                        }
                    } catch (err) {
                        apiError.value = true;
                        showToast("同步失敗", "無法連線，您的變更已安全暫存於本機", "error");
                    } finally {
                        isSyncing.value = false;
                    }
                };

                const handleImageUpload = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (evt) => { appConfig.targetImage = evt.target.result; saveConfigLocalDraft(); };
                        reader.readAsDataURL(file);
                    }
                };

                const addProduct = () => {
                    if (!newProduct.name.trim()) return;
                    appConfig.products.push({
                        id: Date.now(),
                        series: (newProduct.series || '').trim(),
                        name: newProduct.name.trim(),
                        price: Number(newProduct.price || 0)
                    });
                    saveConfigLocalDraft();
                    newProduct.series = '';
                    newProduct.name = '';
                    newProduct.price = null;
                };

                const startEditProduct = (prod) => {
                    editingProductId.value = prod.id;
                    editingProductForm.id = prod.id;
                    editingProductForm.series = prod.series || '';
                    editingProductForm.name = prod.name || '';
                    editingProductForm.price = Number(prod.price || 0);
                };

                const cancelEditProduct = () => {
                    editingProductId.value = null;
                };

                const saveEditProduct = () => {
                    if (!editingProductForm.name.trim()) {
                        showToast("欄位不完整", "商品名稱不可為空白。", "error");
                        return;
                    }
                    const target = appConfig.products.find(p => p.id === editingProductId.value);
                    if (target) {
                        target.series = (editingProductForm.series || '').trim();
                        target.name = editingProductForm.name.trim();
                        target.price = Number(editingProductForm.price || 0);
                        saveConfigLocalDraft();
                    }
                    editingProductId.value = null;
                };

                const deleteProduct = (id) => {
                    if(confirm('刪除？')) {
                        if (editingProductId.value === id) editingProductId.value = null;
                        appConfig.products = appConfig.products.filter(p => p.id !== id);
                        saveConfigLocalDraft();
                    }
                };

                const addPlatform = () => { if (newPlatform.value.trim()) { appConfig.platforms.push({ id: Date.now(), name: newPlatform.value.trim() }); saveConfigLocalDraft(); newPlatform.value = ''; } };
                const deletePlatform = (id) => { if(confirm('刪除？')) { appConfig.platforms = appConfig.platforms.filter(p => p.id !== id); saveConfigLocalDraft(); } };
                const addStatus = () => { if (newStatus.value.trim()) { appConfig.statuses.push({ id: Date.now(), name: newStatus.value.trim() }); saveConfigLocalDraft(); newStatus.value = ''; } };
                const deleteStatus = (id) => { if(confirm('刪除？')) { appConfig.statuses = appConfig.statuses.filter(s => s.id !== id); saveConfigLocalDraft(); } };

                const addItemToOrder = () => {
                    if (!currentItem.name.trim()) return;
                    currentOrder.items.push({
                        series: (currentItem.series || '').trim(),
                        name: currentItem.name.trim(),
                        unitPrice: currentItem.unitPrice || 0,
                        quantity: currentItem.quantity || 1
                    });
                    currentItem.series = ''; currentItem.name = ''; currentItem.unitPrice = null; currentItem.quantity = 1;
                };

                const removeItemFromOrder = (i) => { currentOrder.items.splice(i, 1); };
                const orderTotalAmount = computed(() => currentOrder.items.reduce((sum, i) => sum + ((i.unitPrice || 0) * (i.quantity || 0)), 0));
                
                const addOrderToList = () => {
                    if (currentOrder.items.length === 0) { showToast("無法儲存", "請至少加入一項商品明細", "error"); return; }
                    appOrders.value.push({
                        id: (currentOrder.id || '').trim(),
                        date: currentOrder.date,
                        platform: currentOrder.platform,
                        status: currentOrder.status,
                        items: JSON.parse(JSON.stringify(currentOrder.items)),
                        totalAmount: orderTotalAmount.value
                    });
                    
                    saveOrdersToLocal();
                    resetCurrentOrder();
                    saveOrdersToCloud(true);
                    switchTab('orderList');
                };

                const sortedOrders = computed(() => [...appOrders.value].sort((a, b) => new Date(b.date) - new Date(a.date)));

                const filteredOrders = computed(() => {
                    const q = searchQuery.value.trim().toLowerCase();
                    if (!q) return sortedOrders.value;
                    return sortedOrders.value.filter(o => {
                        const matchId = o.id && o.id.toLowerCase().includes(q);
                        const matchPlatform = o.platform && o.platform.toLowerCase().includes(q);
                        const matchItems = Array.isArray(o.items) && o.items.some(i => {
                            const s = getItemSeries(i).toLowerCase();
                            const n = (i.name || '').toLowerCase();
                            return s.includes(q) || n.includes(q);
                        });
                        return matchId || matchPlatform || matchItems;
                    });
                });

                const updateOrderStatusDirect = (order, newStatus) => {
                    if (order.status === newStatus) return;
                    order.status = newStatus;
                    saveOrdersToLocal();
                    saveOrdersToCloud(true);
                };

                const deleteOrder = (targetOrder) => {
                    if (confirm('確定刪除此訂單？')) {
                        const idx = appOrders.value.indexOf(targetOrder);
                        if (idx !== -1) {
                            appOrders.value.splice(idx, 1);
                            expandedOrders.value = expandedOrders.value.filter(o => o !== targetOrder);
                            saveOrdersToLocal();
                            saveOrdersToCloud(true);
                        }
                    }
                };

                const openEditModal = (o) => {
                    editingOrderIndex.value = appOrders.value.indexOf(o);
                    const cloned = JSON.parse(JSON.stringify(o));
                    if (Array.isArray(cloned.items)) {
                        cloned.items = cloned.items.map(it => ({
                            ...it,
                            series: getItemSeries(it)
                        }));
                    }
                    Object.assign(editingOrder, cloned);
                    editModalOpen.value = true;
                };
                const editingOrderTotal = computed(() => editingOrder.items.reduce((sum, i) => sum + ((i.unitPrice||0) * (i.quantity||0)), 0));
                
                const saveEditOrder = () => {
                    if (editingOrderIndex.value !== -1) {
                        const oldOrder = appOrders.value[editingOrderIndex.value];
                        const wasExpanded = isOrderExpanded(oldOrder);
                        editingOrder.id = (editingOrder.id || '').trim();
                        editingOrder.totalAmount = editingOrderTotal.value;
                        const updatedOrder = JSON.parse(JSON.stringify(editingOrder));
                        appOrders.value[editingOrderIndex.value] = updatedOrder;
                        if (wasExpanded) {
                            expandedOrders.value = expandedOrders.value.map(o => o === oldOrder ? updatedOrder : o);
                        }
                        editModalOpen.value = false;
                        saveOrdersToLocal();
                        saveOrdersToCloud(true);
                    }
                };

                const getStatusBadgeClass = (s) => {
                    if (!s) return 'bg-slate-100 text-slate-600 border-slate-200';
                    if (s.includes('新')) return 'bg-pink-100 text-pink-700 border-pink-200';
                    if (s.includes('打包') || s.includes('處理')) return 'bg-amber-100 text-amber-700 border-amber-200';
                    if (s.includes('出貨') || s.includes('寄出')) return 'bg-blue-100 text-blue-700 border-blue-200';
                    if (s.includes('收款') || s.includes('完成')) return 'bg-emerald-100 text-emerald-700 border-emerald-200';
                    return 'bg-purple-100 text-purple-700 border-purple-200';
                };

                return {
                    isSyncing, apiError, isLoggedIn, loginPassword, login, logout, currentTab, switchTab, mobileMenuOpen, searchQuery, bundleTotalPrice,
                    appConfig, appOrders, newProduct, editingProductId, editingProductForm, startEditProduct, cancelEditProduct, saveEditProduct,
                    productSeriesList, selectedProductSeriesFilter, filteredPresetProducts, getItemSeries,
                    newPlatform, newStatus, currentOrder, currentItem, saveConfigLocalDraft, handleImageUpload, exportConfigJson, 
                    importProductsFromExcel, reloadConfigFromServer,
                    addProduct, deleteProduct, addPlatform, deletePlatform, addStatus, deleteStatus, 
                    addItemToOrder, addOrderToList, removeItemFromOrder, orderTotalAmount, sortedOrders, filteredOrders, deleteOrder, 
                    fetchOrdersFromCloud, saveOrdersToCloud, editModalOpen, editingOrder, editingOrderTotal, openEditModal, 
                    saveEditOrder, getStatusBadgeClass, toast, resetCurrentOrder, formatDate,
                    selectedProductIds, toggleProductSelection, addSelectedProductsToOrder, distributeBundlePrice, copyOrderId,
                    toggleOrderExpand, isOrderExpanded,
                    updateOrderStatusDirect
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
