<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Mezastar ➜ PTCG 卡牌重組計劃</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes pulse-glow { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.05); } }
        .text-celebrate { animation: pulse-glow 2s infinite ease-in-out; }
        .stripe-bg { background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.3) 10px, rgba(255,255,255,0.3) 20px); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">
    <div id="app" class="max-w-5xl mx-auto p-4 sm:p-6 lg:p-8">
        
        <header class="text-center mb-10 mt-4">
            <div class="inline-flex items-center justify-center p-3 bg-white rounded-2xl shadow-sm border border-slate-100 mb-4">
                <i class="fa-solid fa-bolt text-yellow-500 text-3xl mr-3"></i>
                <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-800 tracking-tight">卡牌重組計劃</h1>
            </div>
            <p class="text-slate-500 text-sm sm:text-base font-medium">將寶可夢機台卡片轉換為 PTCG 實體卡牌的雲端同步看板</p>
        </header>

        <!-- 讀取中提示 -->
        <div v-if="isLoading" class="text-center py-20">
            <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-500 mb-3"></i>
            <p class="text-slate-500 font-medium">正在連線至雲端資料庫...</p>
        </div>

        <template v-else>
            <!-- 雲端連線失敗提示 -->
            <div v-if="apiError" class="mb-6 bg-amber-50 border border-amber-200 text-amber-800 px-4 py-3 rounded-xl text-sm flex items-center shadow-sm">
                <i class="fa-solid fa-triangle-exclamation mr-3 text-lg"></i>
                <span>無法連線至 Google 雲端讀取最新資料，目前顯示內容為本機快取或暫無資料，請稍後重整。</span>
            </div>

            <!-- 目標與進度看板 -->
            <div class="bg-white rounded-3xl shadow-lg border border-slate-100 p-6 sm:p-8 mb-10 flex flex-col md:flex-row gap-8 items-center relative overflow-hidden" :class="{'border-yellow-300 shadow-yellow-200/50 shadow-2xl': isTargetReached}">
                <div class="absolute -right-20 -top-20 w-64 h-64 bg-blue-50 rounded-full blur-3xl opacity-60 z-0" :class="{'bg-yellow-100': isTargetReached}"></div>
                
                <div class="relative z-10 w-48 sm:w-56 shrink-0 aspect-[5/7] bg-white border-4 border-slate-100 rounded-2xl shadow-md flex items-center justify-center overflow-hidden group" :class="{'border-yellow-400': isTargetReached}">
                    <img v-if="appConfig.targetImage" :src="appConfig.targetImage" alt="目標 PTCG 卡片" class="w-full h-full object-contain p-2 relative z-10 transition transform group-hover:scale-105 duration-500" />
                    <div v-else class="text-slate-300 flex flex-col items-center relative z-10"><i class="fa-regular fa-image text-4xl mb-3"></i><span class="text-sm font-medium">尚未設定目標</span></div>
                </div>

                <div class="relative z-10 flex-1 w-full">
                    <div v-if="isTargetReached" class="text-center md:text-left mb-2 text-celebrate"><span class="inline-block bg-yellow-100 text-yellow-600 font-extrabold px-4 py-1 rounded-full text-sm border border-yellow-200">🎉 恭喜！已達成 PTCG 實體卡牌兌換目標！</span></div>

                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-4 gap-4">
                        <div>
                            <p class="text-sm text-slate-500 font-bold mb-1 flex items-center"><i class="fa-solid fa-piggy-bank mr-2 text-blue-500"></i>目前累積總額</p>
                            <p class="text-4xl sm:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r" :class="isTargetReached ? 'from-yellow-500 to-orange-500' : 'from-blue-600 to-indigo-600'">NT$ {{ currentTotalAmount.toLocaleString() }}</p>
                        </div>
                        <div class="sm:text-right">
                            <p class="text-sm text-slate-500 font-bold mb-1">目標金額</p>
                            <p class="text-2xl font-bold text-slate-700">NT$ {{ Number(appConfig.targetAmount || 0).toLocaleString() }}</p>
                        </div>
                    </div>
                    
                    <div class="w-full bg-slate-100 rounded-full h-8 mt-6 relative border border-slate-200 shadow-inner flex overflow-hidden">
                        <div class="h-full transition-all duration-1000 ease-out bg-gradient-to-r from-emerald-400 to-emerald-500 relative" :style="{ width: cappedCollectedProgress + '%' }"></div>
                        <div class="h-full transition-all duration-1000 ease-out bg-gradient-to-r from-blue-300 to-blue-400 relative" :style="{ width: cappedPendingProgress + '%' }"><div class="absolute inset-0 stripe-bg w-full h-full"></div></div>
                        <span class="absolute inset-0 flex items-center justify-center text-sm font-extrabold text-white" style="text-shadow: 0 1px 3px rgba(0,0,0,0.6);">總達成率 {{ totalProgressPct }}% (已收金額占比 {{ Math.floor(collectedProgressPct) }}%)</span>
                    </div>
                    
                    <div class="flex flex-wrap justify-between items-center mt-3 gap-2">
                        <div class="flex gap-4 text-xs font-bold">
                            <span class="text-emerald-600 flex items-center"><i class="fa-solid fa-circle text-[10px] mr-1"></i>已收: ${{ collectedAmount.toLocaleString() }}</span>
                            <span class="text-blue-500 flex items-center"><i class="fa-solid fa-circle-half-stroke text-[10px] mr-1"></i>未收: ${{ pendingAmount.toLocaleString() }}</span>
                        </div>
                        <p v-if="!isTargetReached" class="text-xs text-slate-400 font-medium">距離目標還差 NT$ {{ remainingAmount.toLocaleString() }}</p>
                        <p v-else class="text-xs text-yellow-600 font-bold">✨ 超出目標 NT$ {{ (currentTotalAmount - Number(appConfig.targetAmount || 0)).toLocaleString() }}</p>
                    </div>
                </div>
            </div>

            <!-- 銷售與進度清單 -->
            <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                
                <div class="bg-slate-50 px-6 py-5 border-b border-slate-200">
                    
                    <!-- 標題與篩選按鈕列 (已移除按鈕上的數字) -->
                    <div class="flex flex-wrap justify-between items-center gap-4 mb-4">
                        <h2 class="text-xl font-bold text-slate-800 flex items-center"><i class="fa-solid fa-list-ul mr-3 text-emerald-500"></i>銷售明細與出貨進度</h2>
                        
                        <div class="flex flex-wrap bg-white rounded-lg p-1 shadow-sm border border-slate-200 text-sm font-medium gap-1">
                            <button @click="currentFilter = 'all'" :class="currentFilter === 'all' ? 'bg-slate-800 text-white' : 'text-slate-600 hover:bg-slate-100'" class="px-4 py-1.5 rounded-md transition flex items-center">
                                全部
                            </button>
                            <button v-for="st in appConfig.statuses" :key="st.id" @click="currentFilter = st.name" :class="currentFilter === st.name ? 'bg-blue-600 text-white' : 'text-slate-600 hover:bg-slate-100'" class="px-4 py-1.5 rounded-md transition flex items-center">
                                {{ st.name }}
                            </button>
                        </div>
                    </div>

                    <!-- 數量統計小儀表板 (已套用色彩邏輯) -->
                    <div class="flex flex-wrap gap-4 items-center bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-sm">
                        <div class="flex items-center gap-3 pr-5 border-r border-slate-200">
                            <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-lg"><i class="fa-solid fa-boxes-stacked"></i></div>
                            <div>
                                <div class="text-xs text-slate-400 font-bold mb-0.5">總售出項目</div>
                                <div class="font-extrabold text-slate-700 text-xl leading-none">{{ totalSoldQuantity }} <span class="text-xs font-medium text-slate-500">件</span></div>
                            </div>
                        </div>
                        
                        <div class="flex-1 flex flex-wrap gap-3 items-center">
                            <!-- 這裡動態綁定 getStatusStyle 讓顏色跟下方清單狀態完全一致 -->
                            <div v-for="st in appConfig.statuses" :key="st.id" :class="getStatusStyle(st.name)" class="flex flex-col border px-4 py-2 rounded-lg min-w-[70px]">
                                <span class="opacity-80 text-[10px] font-bold mb-0.5">{{ st.name }}</span>
                                <span class="font-extrabold text-lg leading-none">{{ statusCounts[st.name] || 0 }}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="overflow-x-auto hide-scroll">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="bg-white text-slate-500 text-sm border-b border-slate-100"><th class="p-4 pl-6 font-bold whitespace-nowrap">售出日期</th><th class="p-4 font-bold whitespace-nowrap">商品項目</th><th class="p-4 font-bold text-center whitespace-nowrap">當前狀態</th><th class="p-4 pr-6 font-bold text-right whitespace-nowrap">單項金額</th></tr>
                        </thead>
                        <tbody class="divide-y divide-slate-50">
                            <tr v-for="(item, index) in filteredItems" :key="index" class="hover:bg-slate-50/80 transition group">
                                <td class="p-4 pl-6 text-sm text-slate-500 font-medium whitespace-nowrap">{{ formatDate(item.date) }}</td>
                                <td class="p-4">
                                    <div class="font-bold text-slate-700 flex items-center gap-2">{{ item.name }}<span v-if="item.quantity > 1" class="text-xs bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full">x {{ item.quantity }}</span></div>
                                    <div v-if="item.platform" class="text-xs text-slate-400 mt-1"><i class="fa-solid fa-store mr-1"></i>{{ item.platform }}</div>
                                </td>
                                <td class="p-4 text-center">
                                    <div :class="getStatusStyle(item.status)" class="inline-flex items-center justify-center px-3 py-1 rounded-full text-xs font-bold border shadow-sm whitespace-nowrap"><i class="fa-solid fa-circle-dot mr-1.5 text-[8px]"></i>{{ item.status || '未分類' }}</div>
                                </td>
                                <td class="p-4 pr-6 text-right">
                                    <div class="font-extrabold text-emerald-600 group-hover:scale-105 transition transform origin-right">+ NT$ {{ (item.unitPrice * item.quantity).toLocaleString() }}</div>
                                </td>
                            </tr>
                            <tr v-if="filteredItems.length === 0">
                                <td colspan="4" class="p-16 text-center text-slate-400">
                                    <i class="fa-solid fa-box-open text-5xl mb-4 opacity-30 block"></i>
                                    <span v-if="apiError">無法取得雲端資料</span>
                                    <span v-else>此分類目前無銷售紀錄</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </template>
    </div>

    <script>
        const { createApp, ref, reactive, computed, onMounted, watch } = Vue;
        const CONFIG_URL = "config.json"; 

        const fetchWithTimeout = async (url, timeout = 8000, options = {}) => {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, { signal: controller.signal, ...options });
                clearTimeout(timer);
                return response;
            } catch (err) {
                clearTimeout(timer);
                throw err;
            }
        };

        createApp({
            setup() {
                const isLoading = ref(true);
                const apiError = ref(false);
                
                const appConfig = reactive({
                    targetAmount: 10000, targetImage: "", cloudApiUrl: "", products: [], platforms: [],
                    statuses: [{ id: 1, name: "新訂單" }, { id: 4, name: "已收款" }]
                });
                const appOrders = ref([]);
                const currentFilter = ref('all');
                const hasCelebrated = ref(false);

                const formatDate = (dateStr) => {
                    if (!dateStr) return '';
                    try {
                        const d = new Date(dateStr);
                        if (isNaN(d.getTime())) return dateStr;
                        const year = d.getFullYear();
                        const month = String(d.getMonth() + 1).padStart(2, '0');
                        const day = String(d.getDate()).padStart(2, '0');
                        return `${year}-${month}-${day}`;
                    } catch (e) {
                        return dateStr;
                    }
                };

                onMounted(async () => {
                    try {
                        const configRes = await fetchWithTimeout(CONFIG_URL, 3000);
                        if (configRes && configRes.ok) {
                            Object.assign(appConfig, await configRes.json());
                        }
                    } catch (err) {
                        console.warn("無法讀取 config.json，套用預設值", err);
                    }

                    if (appConfig.cloudApiUrl) {
                        try {
                            const ordersRes = await fetchWithTimeout(appConfig.cloudApiUrl, 6000);
                            if (ordersRes && ordersRes.ok) {
                                const data = await ordersRes.json();
                                if (Array.isArray(data)) {
                                    appOrders.value = data;
                                    localStorage.setItem('mezastarOrdersCache', JSON.stringify(data));
                                } else if (data && Array.isArray(data.orders)) {
                                    appOrders.value = data.orders;
                                    localStorage.setItem('mezastarOrdersCache', JSON.stringify(data.orders));
                                } else {
                                    throw new Error("格式錯誤");
                                }
                            } else {
                                throw new Error("HTTP錯誤");
                            }
                        } catch (err) {
                            console.warn("連線雲端失敗，嘗試讀取本機快取", err);
                            apiError.value = true;
                            const cached = localStorage.getItem('mezastarOrdersCache');
                            if (cached) { appOrders.value = JSON.parse(cached); }
                        }
                    } else {
                        apiError.value = true;
                    }

                    isLoading.value = false;
                    if (isTargetReached.value) fireConfetti();
                });

                const collectedAmount = computed(() => appOrders.value.filter(o => o.status && (o.status.includes('已收款') || o.status.includes('已完成'))).reduce((sum, o) => sum + (o.totalAmount || 0), 0));
                const pendingAmount = computed(() => appOrders.value.filter(o => !o.status || (!o.status.includes('已收款') && !o.status.includes('已完成'))).reduce((sum, o) => sum + (o.totalAmount || 0), 0));
                const currentTotalAmount = computed(() => collectedAmount.value + pendingAmount.value);
                
                const targetVal = computed(() => {
                    const val = Number(appConfig.targetAmount);
                    return (!isNaN(val) && val > 0) ? val : 1;
                });

                const remainingAmount = computed(() => Math.max(0, targetVal.value - currentTotalAmount.value));
                const collectedProgressPct = computed(() => (collectedAmount.value / targetVal.value) * 100);
                const pendingProgressPct = computed(() => (pendingAmount.value / targetVal.value) * 100);
                
                const totalProgressPct = computed(() => {
                    const total = collectedProgressPct.value + pendingProgressPct.value;
                    return isNaN(total) ? 0 : Math.min(100, Math.floor(total));
                });

                const cappedCollectedProgress = computed(() => Math.min(100, collectedProgressPct.value));
                const cappedPendingProgress = computed(() => Math.min(100 - cappedCollectedProgress.value, pendingProgressPct.value));
                const isTargetReached = computed(() => currentTotalAmount.value >= targetVal.value && Number(appConfig.targetAmount) > 0);

                watch(isTargetReached, (newVal) => { if (newVal && !hasCelebrated.value) fireConfetti(); });

                const fireConfetti = () => {
                    hasCelebrated.value = true;
                    const duration = 3000, end = Date.now() + duration;
                    (function frame() {
                        confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#10b981', '#3b82f6', '#f59e0b'] });
                        confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#10b981', '#3b82f6', '#f59e0b'] });
                        if (Date.now() < end) requestAnimationFrame(frame);
                    }());
                };

                const flattenedItems = computed(() => {
                    let list = [];
                    appOrders.value.forEach(o => {
                        if (o.items) o.items.forEach(i => list.push({ date: o.date, platform: o.platform, status: o.status, name: i.name, quantity: i.quantity, unitPrice: i.unitPrice }));
                    });
                    return list.sort((a, b) => new Date(b.date) - new Date(a.date));
                });

                const totalSoldQuantity = computed(() => {
                    return flattenedItems.value.reduce((sum, item) => sum + (Number(item.quantity) || 1), 0);
                });

                const statusCounts = computed(() => {
                    const counts = {};
                    flattenedItems.value.forEach(item => {
                        const st = item.status || '未分類';
                        counts[st] = (counts[st] || 0) + (Number(item.quantity) || 1);
                    });
                    return counts;
                });

                const filteredItems = computed(() => {
                    if (currentFilter.value === 'all') return flattenedItems.value;
                    return flattenedItems.value.filter(item => item.status === currentFilter.value);
                });

                const getStatusStyle = (s) => {
                    if (!s) return 'bg-slate-100 text-slate-600 border-slate-200';
                    if (s.includes('新')) return 'bg-pink-50 text-pink-600 border-pink-200';
                    if (s.includes('打包') || s.includes('處理')) return 'bg-amber-50 text-amber-600 border-amber-200';
                    if (s.includes('出貨') || s.includes('寄出')) return 'bg-blue-50 text-blue-600 border-blue-200';
                    if (s.includes('收款') || s.includes('完成')) return 'bg-emerald-50 text-emerald-600 border-emerald-200';
                    return 'bg-purple-50 text-purple-600 border-purple-200';
                };

                return { 
                    isLoading, apiError, appConfig, currentTotalAmount, remainingAmount, 
                    isTargetReached, totalProgressPct, collectedAmount, pendingAmount, 
                    cappedCollectedProgress, cappedPendingProgress, currentFilter, 
                    filteredItems, getStatusStyle, formatDate, collectedProgressPct,
                    totalSoldQuantity, statusCounts
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
