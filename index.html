<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進化之路：Mezastar ➜ PTCG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
    <div id="app" class="max-w-4xl mx-auto p-4 sm:p-8">
        <!-- 標頭 -->
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-bold text-slate-800 mb-2">
                <i class="fa-solid fa-bolt text-yellow-500 mr-2"></i>Mezastar ➜ PTCG 卡牌重組計劃
            </h1>
            <p class="text-slate-500">一人一票，拯救大哥。</p>
        </header>

        <!-- 目標與進度區塊 -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-8 flex flex-col md:flex-row gap-8 items-center">
            <!-- 圖片區塊：採用 PTCG 標準比例 5:7 與 object-contain 防裁切 -->
            <div class="w-48 sm:w-56 shrink-0 aspect-[5/7] bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl flex items-center justify-center overflow-hidden relative">
                <img v-if="data.targetImage" :src="data.targetImage" alt="目標 PTCG 卡片" class="w-full h-full object-contain p-2" />
                <div v-else class="text-slate-400 flex flex-col items-center">
                    <i class="fa-regular fa-image text-3xl mb-2"></i>
                    <span class="text-sm">尚未設定目標</span>
                </div>
            </div>

            <!-- 進度條區塊 -->
            <div class="flex-1 w-full">
                <div class="flex justify-between items-end mb-2">
                    <div>
                        <p class="text-sm text-slate-500 font-medium mb-1">目前累積金額</p>
                        <p class="text-4xl font-bold text-blue-600">NT$ {{ currentAmount.toLocaleString() }}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-sm text-slate-500 font-medium mb-1">目標金額</p>
                        <p class="text-xl font-semibold text-slate-700">NT$ {{ data.targetAmount.toLocaleString() }}</p>
                    </div>
                </div>
                
                <div class="w-full bg-slate-200 rounded-full h-6 mt-4 relative overflow-hidden">
                    <div class="bg-blue-500 h-6 rounded-full transition-all duration-1000 ease-out" :style="{ width: progress + '%' }"></div>
                    <span class="absolute inset-0 flex items-center justify-center text-xs font-bold text-white shadow-sm" style="text-shadow: 0 1px 2px rgba(0,0,0,0.5);">
                        達成率 {{ progress }}%
                    </span>
                </div>
            </div>
        </div>

        <!-- 銷售紀錄清單 -->
        <div class="bg-white rounded-2xl shadow-lg p-6">
            <h2 class="text-xl font-bold mb-4 border-b pb-2"><i class="fa-solid fa-list-ul mr-2"></i>已售出項目紀錄</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-600 text-sm border-b">
                            <th class="p-3 font-semibold rounded-tl-lg">售出日期</th>
                            <th class="p-3 font-semibold">商品名稱 (Mezastar 等)</th>
                            <th class="p-3 font-semibold text-right rounded-tr-lg">售出金額</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="item in sortedSales" :key="item.id" class="border-b hover:bg-slate-50 transition">
                            <td class="p-3 text-slate-500">{{ item.date }}</td>
                            <td class="p-3 font-medium">{{ item.name }}</td>
                            <td class="p-3 text-right font-bold text-emerald-600">+ NT$ {{ item.price.toLocaleString() }}</td>
                        </tr>
                        <tr v-if="data.sales.length === 0">
                            <td colspan="3" class="p-8 text-center text-slate-400">目前尚無銷售紀錄</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {
                const data = ref({
                    targetAmount: 10000,
                    targetImage: '',
                    sales: []
                });

                onMounted(() => {
                    const localData = localStorage.getItem('mezastarToPtcgData');
                    if (localData) {
                        const parsed = JSON.parse(localData);
                        data.value.targetAmount = parsed.targetAmount || 10000;
                        data.value.targetImage = parsed.targetImage || '';
                        data.value.sales = parsed.sales || [];
                    }
                });

                const currentAmount = computed(() => {
                    return data.value.sales.reduce((sum, item) => sum + Number(item.price), 0);
                });

                const progress = computed(() => {
                    if (data.value.targetAmount <= 0) return 0;
                    const pct = (currentAmount.value / data.value.targetAmount) * 100;
                    return Math.min(100, Math.round(pct));
                });

                const sortedSales = computed(() => {
                    return [...data.value.sales].sort((a, b) => new Date(b.date) - new Date(a.date));
                });

                return { data, currentAmount, progress, sortedSales };
            }
        }).mount('#app');
    </script>
</body>
</html>
